name: Auto Versioning

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Incrementar versão
        run: |
          CURRENT=$(cat version.txt)
          echo "Versão atual: $CURRENT"

          # TODO 1: separar "v0.0.1" em três partes (MAJOR, MINOR, PATCH)
          # TODO 2: somar 1 ao PATCH
          # TODO 3: montar a nova versão e gravar em version.txt

          echo "Nova versão: $(cat version.txt)"

      - name: Commit e push da nova versão
        run: |
          git config user.name "CI Bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add version.txt
          git commit -m "chore: bump version to $(cat version.txt)"
          git push